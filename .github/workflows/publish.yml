name: Publish to VS Code Marketplace / Open VSX

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npx @vscode/vsce@4.0.0 publish --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Cursor and other VS Code forks pull from Open VSX, not the Microsoft
      # Marketplace, so a release isn't visible there without this too.
      # No-ops if OVSX_PAT (from open-vsx.org) isn't set.
      - if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish --pat "$OVSX_PAT"
